<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sets data-theme before the first paint. Inline and synchronous on purpose: a
         deferred or bundled script paints the default palette first, and on a dark-first
         app that flash is a full white screen.
         The only copy of this logic. The key below must match STORAGE_KEY in
         src/theme.js, which is the one thing here that can silently drift. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('movie-league-theme');
          var dark = saved === 'dark' || (saved !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantasy Movie League</title>
    <!-- SVG first so the icon follows the browser's light/dark setting the way the app
         does; the PNG is there because Safari's SVG favicon support is not worth betting
         a 404 on, and a raster cannot follow the theme. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
