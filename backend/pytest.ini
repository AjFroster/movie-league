[pytest]
testpaths = tests
asyncio_mode = auto

markers =
    provider_contract: makes real calls to TMDB/OMDb/MDBList. Needs keys, spends quota, and
        can fail for reasons unrelated to the commit under test. Excluded from the default
        run; the nightly workflow selects it with `-m provider_contract`.

# The default run is everything that does not touch the network.
addopts = -m "not provider_contract"
