name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to a PR makes the previous run's answer irrelevant, so stop it rather than
# paying for both. Never cancel master: its runs are the record of what is green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # 3.12 matches the local venv. Pinned rather than "3.x" so a new Python release
      # cannot turn a green suite red overnight without anyone changing the code.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No API keys are configured for this workflow, deliberately. conftest.py already
      # strips TMDB/OMDB/MDBLIST/CLERK from the environment, and a suite that only passes
      # because a developer happened to export a key is a broken suite. CI is the honest
      # check that the tests are self-contained.
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` not `install`: it installs exactly the lockfile and fails if package.json and
      # the lock disagree, which is a real bug worth failing on rather than papering over.
      - name: Install dependencies
        run: npm ci

      # A bundler does not care whether your CSS is complete, so a lost block of rules
      # builds green and ships an unstyled component. This catches that; a rebase's
      # auto-merge silently deleted one.
      - name: Check CSS coverage
        run: npm run check:css

      # There are no frontend unit tests yet, but the build is not a formality: it is what
      # catches a broken import, a bad JSX edit, or malformed CSS. Both have happened here.
      - name: Build
        run: npm run build
